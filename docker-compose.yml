services:
  nginx:
    image: nginx:1.27-alpine
    container_name: logmovy_motoboys_nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8020}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docs:/var/www/html/docs:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - logmovy_motoboys_net

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: logmovy_motoboys_php
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/www/html/src:ro
      - ./public:/var/www/html/public:ro
      - ./docs:/var/www/html/docs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - logmovy_motoboys_net

  mysql:
    image: mysql:8.4
    container_name: logmovy_motoboys_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-logmovy_cadastro}
      MYSQL_USER: ${DB_USERNAME:-logmovy_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-logmovy_pass_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-logmovy_root_secret}
      TZ: America/Sao_Paulo
    ports:
      - "${MYSQL_PORT:-3320}:3306"
    volumes:
      - motoboys_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-logmovy_root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - logmovy_motoboys_net

  redis:
    image: redis:7.4-alpine
    container_name: logmovy_motoboys_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - logmovy_motoboys_net

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: logmovy_motoboys_phpmyadmin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PMA_HOST: ${PMA_HOST:-host.docker.internal}
      PMA_PORT: ${PMA_PORT:-3307}
      PMA_USER: ${DB_USERNAME:-logmovy_user}
      PMA_PASSWORD: ${DB_PASSWORD:-logmovy_pass_secret}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8021}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - logmovy_motoboys_net

volumes:
  motoboys_mysql_data:

networks:
  logmovy_motoboys_net:
    driver: bridge

