[PHP]
memory_limit = 256M
expose_php = Off
max_execution_time = 15
max_input_time = 15
post_max_size = 2M
upload_max_filesize = 2M
default_charset = "UTF-8"
date.timezone = "America/Sao_Paulo"
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
realpath_cache_size = 4096K
realpath_cache_ttl = 600

