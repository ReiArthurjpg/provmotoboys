<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogMovy Motoboys API — Documentação Swagger (Porta 8020)</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      background: #0b0f17;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .logmovy-topbar {
      background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 1px solid rgba(163, 230, 53, 0.35);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logmovy-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      font-size: 16px;
      color: #ffffff;
    }
    .logmovy-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #a3e635;
      box-shadow: 0 0 12px #a3e635;
    }
    .logmovy-pill {
      font-size: 12px;
      background: rgba(163, 230, 53, 0.14);
      color: #a3e635;
      border: 1px solid rgba(163, 230, 53, 0.4);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    #swagger-ui {
      background: #ffffff;
      min-height: calc(100vh - 55px);
    }
  </style>
</head>
<body>
  <div class="logmovy-topbar">
    <div class="logmovy-brand">
      <span class="logmovy-dot"></span>
      <span>LOGMOVY — API EXECUTIVA DE GESTÃO & HOMOLOGAÇÃO DE MOTOBOYS</span>
    </div>
    <span class="logmovy-pill">Porta 8020 • Banco Compartilhado com CadastroMotoboys</span>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function () {
      const basePath = window.location.pathname.replace(/\/docs\/?(index\.html)?$/, '');
      window.ui = SwaggerUIBundle({
        url: (basePath ? basePath : '') + '/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        persistAuthorization: true,
      });
    };
  </script>
</body>
</html>
